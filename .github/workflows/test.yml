name: Test Riftbound
on: [push, pull_request]

permissions:
  contents: read

jobs:
  arena:
    runs-on: ubuntu-latest
    # Hosted WebKit renders the pixel sheets in software. Its multi-window
    # tests share a runner with the game server and need a worker of their own.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check every fighter outfit and animation frame
        run: |
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/fighter-check" "Pillow==12.2.0"
          PYTHONPATH="$RUNNER_TEMP/fighter-check" python3 scripts/check-fighter-skins.py
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run test:turn:webkit -- --workers=1
      - run: npm run simulate -- 12 4 ci
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
          if-no-files-found: ignore
