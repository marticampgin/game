name: Test Riftbound
on: [push, pull_request]

permissions:
  contents: read

jobs:
  arena:
    runs-on: ubuntu-latest
    # The complete Chromium run takes about five minutes before the desktop
    # WebKit suite starts. Leave both browsers time to finish on a hosted runner.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run test:turn:webkit
      - run: npm run simulate -- 12 4 ci
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
          if-no-files-found: ignore
